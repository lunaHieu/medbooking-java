server:
  servlet:
    context-path: /api

spring:
  application:
    name: medbook

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwtSecret: ${APP_JWTSECRET}
  jwtExpirationMs: 86400000

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,https://medbooking-client-flax.vercel.app,https://medbooking-client-hdbm.vercel.app}

