spring:
  datasource:
    url: jdbc:h2:mem:medbook-test;MODE=MySQL;DATABASE_TO_LOWER=true;CASE_INSENSITIVE_IDENTIFIERS=true;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  mail:
    password: test-mail-password

app:
  jwtSecret: test-only-jwt-secret-with-at-least-thirty-two-characters

cloudinary:
  cloud_name: test-cloud
  api_key: test-key
  api_secret: test-secret
